name: Check public source connection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Check system HTTP client
        run: |
          curl --fail --location --max-time 30 --output fred.csv 'https://fred.stlouisfed.org/graph/fredgraph.csv?id=DFF&cosd=2026-10-01&coed=2026-10-17'
          head -3 fred.csv
