name: Publish forma.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_sec:
        description: Refresh all SEC company reports as well as holdings and macro
        default: false
        type: boolean
  schedule:
    - cron: '22 7 * * 1-5' # Weekday holdings and macro; SEC reports Tuesday and Friday
permissions:
  contents: read
concurrency:
  group: forma-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .cache/sec
          key: sec-responses-${{ github.run_id }}
          restore-keys: sec-responses-
      - name: Validate saved inputs
        run: |
          python -m unittest discover -s tests -q
          python -m engine verify-sources
          python -m engine validate
      - name: Refresh membership, economic context and company reports
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          FORCE_SEC_REFRESH: ${{ inputs.refresh_sec }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          python -m engine universe
          python -m engine macro
          weekday=$(date -u +%u)
          if [ "$FORCE_SEC_REFRESH" = 'true' ] || { [ "$SCHEDULED" = 'true' ] && { [ "$weekday" = 2 ] || [ "$weekday" = 5 ]; }; }; then
            python -m engine refresh --archive
          else
            python -m engine sync
          fi
      - name: Verify publication candidate
        run: |
          python -m engine build
          python -m engine validate
          python -m engine verify-sources
          python -m engine replicate
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm test
      - name: Preserve the tested refresh
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'forma-data-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/ data/universe.json data/snapshots/ data/raw/ data/holdings/ data/membership/ data/macro/
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh dated small-cap coverage and evidence'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
