name: Publish forma.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_sec:
        description: 'Update SEC filing panel before publishing (requires SEC_CONTACT secret)'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '22 6 * * 2,5'  # Twice weekly UTC. Freshness not guaranteed.
permissions:
  contents: write
concurrency:
  group: forma-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate before publication
        run: |
          python -m unittest discover -s tests -v
          python -m engine validate
      - name: Refresh SEC observations when configured
        if: github.event_name == 'schedule' || inputs.refresh_sec == true
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: |
          if [ -z "$SEC_CONTACT" ]; then
            echo 'SEC_CONTACT secret not set; retaining previous dataset.'
          else
            python -m engine refresh --archive
            python -m engine validate
            git config user.name 'forma-data-bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add site/data/research.json data/snapshots/
            if ! git diff --cached --quiet; then
              git commit -m 'data: refresh SEC observation panel'
              git push origin HEAD:main
            fi
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages artifact
        id: deploy
        uses: actions/deploy-pages@v4
